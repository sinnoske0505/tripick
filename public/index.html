<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D2361F">
<title>TRIPICK</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="app">

  <!-- 1 시작 화면 -->
  <section id="s-splash" class="screen splash active" aria-label="시작 화면">
    <div class="splash-logo" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="9" y="7" width="6" height="10" rx="1.5"/><path d="M10.5 7V5.5h3V7"/></svg>
    </div>
    <h1 class="wordmark">TRIPICK</h1>
    <p class="splash-tag">찍으면 한국어로 읽히는<br>돈키호테 화장품</p>
    <div class="splash-foot">
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <p>오늘 환율과 제품 정보를 불러오는 중</p>
    </div>
  </section>

  <!-- 2 홈 -->
  <section id="s-home" class="screen light" aria-label="홈">
    <header class="bar">
      <div class="wordmark small">TRIP<span>ICK</span></div>
      <button class="icon-btn white" data-go="saved" aria-label="저장 목록">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
    </header>
    <div class="home-copy">
      <h1>궁금한 화장품을<br>찍어보세요</h1>
      <p>제품명, 원화 가격, 전성분을 한국어로 알려드려요</p>
    </div>
    <div class="home-center">
      <label class="big-shot" for="in-product">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-3.2l-1.6-2.4A1 1 0 0 0 14.4 4H9.6a1 1 0 0 0-.8.6L7.2 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>제품 찍기</span>
      </label>
      <span class="hint">제품 앞면이 잘 보이게 찍어주세요</span>
    </div>
    <div class="stack">
      <div class="card row-between">
        <div class="col">
          <span class="sub">오늘 환율 · <span id="rate-date">-</span> 기준</span>
          <strong class="big-text">100엔 = <span id="rate-val">-</span>원</strong>
        </div>
      </div>
      <button class="card row-between link-card" data-go="saved">
        <strong>저장한 제품 <span id="saved-count">0</span>개</strong>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </section>

  <!-- 4 분석 중 -->
  <section id="s-analyzing" class="screen light" aria-label="분석 중">
    <header class="bar"><button class="icon-btn" data-go="home" aria-label="취소">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
    <div class="preview-wrap"><img id="preview" alt="찍은 사진"></div>
    <div class="center-copy">
      <h1 id="an-title">상품을 알아보는 중이에요</h1>
      <p>보통 몇 초 안에 끝나요</p>
    </div>
    <ol id="an-steps" class="steps card"></ol>
  </section>

  <!-- 5 결과 -->
  <section id="s-result" class="screen light scroll" aria-label="제품 정보">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="홈으로">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="bar-title">제품 정보</span>
      <label class="icon-btn accent" for="in-product" aria-label="다른 제품 찍기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-3.2l-1.6-2.4A1 1 0 0 0 14.4 4H9.6a1 1 0 0 0-.8.6L7.2 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><circle cx="12" cy="13" r="4"/></svg>
      </label>
    </header>
    <div id="result-body"></div>
  </section>

  <!-- 5-2/5-3 가격표 판별 -->
  <section id="s-price" class="screen light scroll" aria-label="가격표 판별">
    <header class="bar"><button class="icon-btn" data-go="result" aria-label="뒤로">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button></header>
    <div id="price-body"></div>
  </section>

  <!-- 6 저장 목록 -->
  <section id="s-saved" class="screen light scroll" aria-label="저장 목록">
    <header class="bar">
      <button class="icon-btn" data-go="home" aria-label="홈으로">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="bar-title">저장 목록</span>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <div id="saved-body"></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</main>

<!-- 휴대폰에서는 바로 카메라가 열린다 -->
<input id="in-product" type="file" accept="image/*" capture="environment" hidden>
<input id="in-tag" type="file" accept="image/*" capture="environment" hidden>

<script src="/app.js" type="module"></script>
</body>
</html>
